name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Bloqueante: instalación reproducible, lint (tsc), build y unit/component
  # tests. Si esto rompe, la rama no debería mergearse.
  install-lint-build-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lint (chequeo de tipos TypeScript)
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Unit + API + component tests con cobertura (Vitest)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: coverage/
          retention-days: 7

  # Informativo por ahora (no bloquea el merge): chequeo de dependencias
  # vulnerables y de secretos commiteados por error.
  security-and-deps:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Confirma que las migraciones en supabase/migrations/ reconstruyen una
  # base vacía sin errores — la reproducibilidad de la Fase 1, chequeada en
  # cada PR en vez de solo una vez a mano. No corre la suite de
  # supabase/tests/*.sql: esos scripts asumen las cuentas reales sembradas
  # en el proyecto remoto (mismos UUIDs), no una base local recién creada
  # sin seed — correrlos acá daría falsos negativos, no una prueba real.
  supabase-migrations-reproducible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Reconstruir el esquema desde cero con las migraciones del repo
        run: supabase db start

  # Los E2E se vuelven bloqueantes únicamente cuando el repositorio tiene
  # configurado el backend público. Si faltan esos secrets, el job queda
  # verde pero informa que fue omitido. Los specs autenticados y los que
  # crean fixtures se auto-omiten cuando faltan sus credenciales específicas.
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: install-lint-build-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Detectar configuración E2E sin imprimir secretos
        id: e2e-config
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [[ -n "$VITE_SUPABASE_URL" && -n "$VITE_SUPABASE_ANON_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "E2E omitido: faltan VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY."
          fi
      - if: steps.e2e-config.outputs.configured == 'true'
        run: npx playwright install --with-deps chromium
      - name: E2E de navegador por capas
        if: steps.e2e-config.outputs.configured == 'true'
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DEMO_MODE: 'true'
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_TECHNICIAN_EMAIL: ${{ secrets.E2E_TECHNICIAN_EMAIL }}
          E2E_TECHNICIAN_PASSWORD: ${{ secrets.E2E_TECHNICIAN_PASSWORD }}
          E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
          E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
