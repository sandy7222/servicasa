<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TecniUrbano — Servicios a domicilio</title>
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0F172A" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('tecniurbano_theme');
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TecniUrbano" />
    <meta name="description" content="TecniUrbano — Servicios a domicilio" />
    <meta property="og:title" content="TecniUrbano — Servicios a domicilio" />
    <meta property="og:description" content="Gestión integral de servicios técnicos a domicilio para administradores, técnicos y clientes." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-tu-bg antialiased" style="font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
